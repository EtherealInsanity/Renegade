<!DOCTYPE html>
<html lang="en" data-theme="slaughter">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} - Renegade Immortal</title>
  <meta name="chapter-number" content="{{CHAPTER_NUM}}">
  <meta name="description" content="Read {{TITLE}} from Renegade Immortal online. Ad-free, fast static xianxia novel reader.">
  <link rel="stylesheet" href="../assets/themes.css">
  <link rel="stylesheet" href="../assets/reader.css">
  <link rel="icon" type="image/jpeg" href="../assets/cover.jpg">
</head>
<body>
  <div id="progress-bar"></div>

  <!-- Reader Top Header -->
  <header class="reader-header">
    <div class="header-left">
      <a href="../index.html" class="logo-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        <span>Renegade Reader</span>
      </a>
    </div>

    <div class="header-right">
      <select id="chapter-jumper" class="chapter-jump-select" aria-label="Jump to chapter">
        {{CHAPTER_OPTIONS}}
      </select>

      <button id="btn-open-settings" class="icon-btn" aria-label="Reading Controls">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Display</span>
      </button>
    </div>
  </header>

  <!-- Main Chapter Reader -->
  <main class="reader-container">
    <div class="chapter-title-area">
      <h1>{{TITLE}}</h1>
      <div class="chapter-meta-badge">
        <span>📖 {{BOOK_TITLE}}</span>
        <span>✍️ {{WORD_COUNT}} words</span>
        <span>⏱️ ~{{READ_TIME}} min read</span>
      </div>
    </div>

    <!-- Chapter Body Text -->
    <article class="chapter-body">
      {{CONTENT}}
    </article>

    <!-- Cultivator's Insights (Local Chapter Notes) -->
    <section class="cultivator-notes-section">
      <div class="notes-header">
        <h3>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Cultivator's Insights (Chapter Notes)
        </h3>
        <span class="notes-status" id="notes-status"></span>
      </div>
      <textarea id="chapter-notes" class="notes-textarea" placeholder="Record your enlightenment insights, character realizations, or bookmarks for this chapter..."></textarea>
      <div class="notes-actions">
        <button id="btn-clear-note" class="icon-btn">Clear</button>
        <button id="btn-save-note" class="icon-btn" style="border-color: var(--accent-color); color: var(--accent-color);">Save Insight</button>
      </div>
    </section>

    <!-- Navigation Footer -->
    <nav class="chapter-nav-bar" aria-label="Chapter Navigation">
      <a id="nav-prev-btn" href="{{PREV_HREF}}" class="chapter-nav-btn {{PREV_DISABLED}}">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        <span>{{PREV_LABEL}}</span>
      </a>

      <a href="../index.html" class="chapter-nav-btn" style="flex: 0 0 auto;">
        <span>Index</span>
      </a>

      <a id="nav-next-btn" href="{{NEXT_HREF}}" class="chapter-nav-btn {{NEXT_DISABLED}}">
        <span>{{NEXT_LABEL}}</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </nav>
  </main>

  <!-- Reader Settings Drawer -->
  <aside id="settings-drawer" class="settings-drawer" aria-label="Reading Settings">
    <div class="drawer-header">
      <h2>Daoist Display</h2>
      <button id="btn-close-settings" class="icon-btn" aria-label="Close">✕</button>
    </div>

    <!-- 13 Xianxia Themes -->
    <div class="setting-group">
      <label>13 Cultivation Themes</label>
      <div class="theme-grid">
        <button class="theme-btn active" data-theme-name="slaughter">Slaughter Domain</button>
        <button class="theme-btn" data-theme-name="bead">Defying Bead</button>
        <button class="theme-btn" data-theme-name="ancient-god">Royal Ancient God</button>
        <button class="theme-btn" data-theme-name="life-death">Life & Death</button>
        <button class="theme-btn" data-theme-name="karma">Karma Domain</button>
        <button class="theme-btn" data-theme-name="true-false">True & False</button>
        <button class="theme-btn" data-theme-name="yellow-springs">Yellow Springs</button>
        <button class="theme-btn" data-theme-name="suzaku">Suzaku Star</button>
        <button class="theme-btn" data-theme-name="allheaven">Allheaven Star</button>
        <button class="theme-btn" data-theme-name="cloud-sea">Cloud Sea</button>
        <button class="theme-btn" data-theme-name="astral">Immortal Astral</button>
        <button class="theme-btn" data-theme-name="bamboo">Bamboo Scroll</button>
        <button class="theme-btn" data-theme-name="medicine-pavilion">Medicine Pavilion</button>
      </div>
    </div>

    <!-- Font Size -->
    <div class="setting-group">
      <label>Script Font Size (<span id="val-font-size">19px</span>)</label>
      <div class="slider-container">
        <input type="range" id="slider-font-size" min="15" max="28" value="19" step="1">
      </div>
    </div>

    <!-- Line Height -->
    <div class="setting-group">
      <label>Line Spacing (<span id="val-line-height">1.8</span>)</label>
      <div class="slider-container">
        <input type="range" id="slider-line-height" min="1.4" max="2.4" value="1.8" step="0.1">
      </div>
    </div>

    <!-- Max Width -->
    <div class="setting-group">
      <label>Reading Width (<span id="val-max-width">780px</span>)</label>
      <div class="slider-container">
        <input type="range" id="slider-max-width" min="550" max="1100" value="780" step="20">
      </div>
    </div>

    <!-- Font Family -->
    <div class="setting-group">
      <label>Calligraphy Font</label>
      <select id="select-font-family" class="font-select">
        <option value="'Merriweather', Georgia, serif">Merriweather (Serif)</option>
        <option value="'Georgia', serif">Georgia (Classical)</option>
        <option value="'Inter', -apple-system, sans-serif">Inter (Modern Clean)</option>
        <option value="system-ui, -apple-system, sans-serif">System Sans</option>
        <option value="'Courier New', monospace">Scroll Monospace</option>
      </select>
    </div>
  </aside>

  <div id="drawer-backdrop" class="drawer-backdrop"></div>

  <script src="../assets/reader.js"></script>
</body>
</html>
